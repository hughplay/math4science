name: Build licensed chapter PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_readings.py'
      - '.github/workflows/build-readings.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extraction dependencies
        run: pip install pymupdf requests
      - name: Download licensed originals and create chapter excerpts
        run: python scripts/build_readings.py
      - name: Commit the resulting small PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readings/
          if ! git diff --cached --quiet; then
            git commit -m 'Add licensed short PDFs for course readings'
            git push
          fi
# Rebuild after source URL fallback update.
