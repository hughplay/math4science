.course-block{padding:29px 32px}.course-section-head{margin-bottom:19px}.course-section-head h3{font-size:21px;letter-spacing:-.03em;margin:5px 0 7px}.course-section-head p{font-size:13px;color:var(--muted);max-width:780px;margin:0;line-height:1.86}.course-kicker{display:block;font-size:10px;color:var(--brand);letter-spacing:.12em;text-transform:uppercase;font-weight:800}.reading-list{display:grid;gap:11px}.reading-item{border:1px solid var(--line);border-radius:13px;padding:16px 17px;display:flex;align-items:flex-start;gap:14px;background:var(--surface);transition:.16s}.reading-item:hover{border-color:#81bcb0;box-shadow:var(--shadow);transform:translateY(-1px)}.reading-num{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;background:var(--brandsoft);color:var(--brand);font-size:11px;font-weight:800;border-radius:9px}.reading-text{flex:1;min-width:0}.reading-text strong{display:block;color:var(--ink);font-size:14px;margin:2px 0 5px}.reading-text p{font-size:12px;line-height:1.8;color:var(--muted);margin:7px 0 0}.reading-kicker{color:var(--brand);font-size:10px;font-weight:800}.reading-chapter{font-size:12px;font-weight:650;line-height:1.65}.reading-open{color:var(--brand);font-size:16px;font-weight:800}.resource-note{margin-top:12px;color:var(--muted);font-size:11px}.mini-chapter{border-top:1px solid var(--line);padding:22px 0 10px}.mini-chapter .chapter-index{font-size:15px;font-weight:800;margin-bottom:10px;color:var(--ink)}.mini-chapter p{color:var(--ink);font-size:13.3px;line-height:2;margin:9px 0 13px}.math-inline{font-family:Georgia,'Times New Roman',serif;font-size:1.09em;color:var(--branddark)}.math-display{display:block;overflow-x:auto;padding:18px 22px;margin:15px 0 20px;border-radius:11px;background:var(--brandsoft);color:var(--branddark);font-family:Georgia,'Times New Roman',serif;font-size:16px;letter-spacing:.015em;line-height:1.7;white-space:nowrap}.mini-chapter code{padding:1px 5px;background:var(--surface2);border:1px solid var(-- tart strong{color:var(--branddark)}.course-start p{margin:6px 0 0;color:var(--muted);font-size:12px}@media(max-width:650px){.course-block{padding:21px 17px}.reading-item{padding:14px 12px;gap:10px}.reading-text strong{font-size:13px}.math-display{font-size:14px;padding:13px 12px}.mini-chapter p{font-size:12.5px}}
</style></head><body><div class="mobile-shade" id="shade"></div><div class="layout"><aside class="sidebar"><div class="logo"><div class="logo-mark">M∑</div><div><strong>Math × Science</strong><small>RESEARCH LEARNING</small></div></div><div class="side-label">LEARNING SPACE</div><nav aria-label="主导航"><button class="nav-btn" data-go="home"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg> 学习总览</button><button class="nav-btn" data-go="roadmap"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><rect height="18" rx="2" width="18" x="3" y="3"></rect><path d="M8 3v18M3 9h18"></path></svg> 12 周学习路线</button><button class="nav-btn" data-go="concepts"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"></path></svg> 数学知识图谱</button><button class="nav-btn" data-go="derivations"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"></path></svg> 推导工作台</button><button class="nav-btn" data-go="visualizer"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><rect height="18" rx="2" width="18" x="3" y="3"></rect><path d="M8 3v18M3 9h18"></path></svg> 交互直觉实验</button><button class="nav-btn" data-go="lab"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="M9 3h6m-5 0v7l-6 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3M7 16h10"></path></svg> 研究假设实验室</button></nav><div class="side-label">LIBRARY</div><nav aria-label="资源和设置"><button class="nav-btn" data-go="resources"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg> 学习资料库</button><button class="nav-btn" data-go="settings"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.86 1.86-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.5V20h-2.6v-.15a1.65 1.65 0 0 0-1-1.5 1.65 1.65 0 0 0-1.82.33l-.06.06-1.86-1.86.06-.06A1.65 1.65 0 0 0 7.1 15a1.65 1.65 0 0 0-1.5-1H5.5v-2.6h.1a1.65 1.65 0 0 0 1.5-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L8.57 6.7l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.5V5.5h2.6v.1a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.86 1.86-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.5 1h.1V14h-.1a1.65 1.65 0 0 0-1.5 1Z"></path></svg> 设置与备份</button></nav><div class="side-bottom"><div class="side-progress-label"><span>总学习进度</span><b id="side-completed">0 / 36</b></div><div class="progress"><span id="side-meter" style="width:0%"></span></div><div class="sidebar-tip">每天积累一点推导能力。<br>每周完成一项可复现的实验或数学解释。</div></div></aside><div class="main"><header class="topbar"><button class="icon-button mobile-menu" aria-label="打开菜单" id="menu-btn"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><div class="crumb"><span>LEARNING SPACE</span><span> / </span><b id="crumb">学习总览</b></div><div class="top-actions"><div class="search-box"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg> <input id="search" placeholder="搜索知识点、公式、模型..." aria-label="搜索学习内容" autocomplete="off"><div id="search-results" class="search-results"></div></div><button class="icon-button" id="theme-btn" aria-label="切换深色模式"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="18"><path d="M20.985 12.486a9 9 0 1 1-9.472-9.472c.405-.02.616.478.402.822a6 6 0 0 0 8.248 8.248c.344-.214.842-.003.822.402Z"></path></svg></button></div></header><div class="content" id="page"></div></div></div><div role="status" aria-live="polite" id="toast" class="toast"></div><script>const WEEKS = [
  {n:1,phase:'基础恢复',label:'重新建立数学手感',subtitle:'用生成模型所需的概念，快速恢复微积分与概率直觉',color:'#6B79C8',deliverable:'独立算出高斯分布的 score，并解释 MSE 回归为什么对应条件期望。',question:'你能把神经网络的训练目标解释成一个数学最优化问题吗？',lessons:[
    {id:'w1l1',name:'梯度、Jacobian 与链式法则',time:75,tags:['微积分','向量计算'],intro:'梯度告诉你标量函数对向量的局部敏感性；Jacobian 则把多变量函数的微小变化映射到输出空间。理解形状（shape）与链式法则，比背公式更重要。',formula:'d f ≈ (∇f)ᵀ d x；J(f ∘ g) = Jf(g(x)) · Jg(x)',explain:'从微分 df 出发，逐步写出向量到向量、向量到标量的链式法则；逐项标注维度，避免凭记忆转置。',derive:['推导 f(x)=‖Ax−b‖² 的梯度，并检查矩阵维度。','对 f(x)=log p(g(x)) 写出完整链式法则。','解释 ∇、Jacobian 与 Hessian 各代表什么。'],experiment:'用 PyTorch autograd 对 3 维输入做有限差分检查，记录相对误差随步长的变化。',research:'当一个模型把坐标、角度、旋转矩阵混用时，梯度是否仍属于正确的空间？',quiz:['Jacobian 的核心作用是什么？','描述多维映射的一阶线性近似','描述所有高阶导数','保证一个函数可逆'],answer:0,why:'Jacobian 是映射在局部的线性近似。是否可逆还需要额外条件。'},
    {id:'w1l2',name:'多元高斯、协方差与 Score',time:75,tags:['概率','Score'],intro:'高斯分布不只是一个方便的噪声模型：它使得 score、条件分布与扩散扰动的很多公式可以显式计算。关键在于理解协方差矩阵如何改变空间中的方向。',formula:'∇ₓ log 𝒩(x;μ,Σ) = −Σ⁻¹(x−μ)',explain:'从 log density 出发求梯度；当 Σ=σ²I 时，score 指向均值，且强度与 1/σ² 成正比。',derive:['独立推导 d 维高斯分布的 log density。','推导其 score，并给出 Σ=σ²I 的特例。','解释为什么协方差较小的方向 score 更陡。'],experiment:'在二维相关高斯上可视化等密度线和 score 向量场，对比 Σ 为对角与非对角矩阵。',research:'当科学数据分布处于低维流形附近时，各方向的噪声尺度是否应该相同？',quiz:['对各向同性高斯，增大 σ 后同一点的 score 模长如何变化？','变小','变大','保持不变'],answer:0,why:'score 为 −(x−μ)/σ²；在 x 固定时模长按 1/σ² 缩小。'},
    {id:'w1l3',name:'条件期望与平方损失的最优解',time:80,tags:['概率','最优化'],intro:'Flow Matching 中最关键的桥梁之一是：给定 x 的最优 MSE 预测就是条件期望。这是从条件速度场走向边缘速度场的入口。',formula:'argmin_f 𝔼‖Y−f(X)‖² = 𝔼[Y | X]',explain:'令 m(X)=𝔼[Y|X]，将 Y−f(X) 写成 (Y−m(X))+(m(X)−f(X))；交叉项的条件期望为零。',derive:['完成平方损失的正交分解。','说明条件期望为何只依赖 X。','思考目标有多种可能值时，最优预测的意义。'],experiment:'制造 Y=X²+ε，训练 MLP 与真实条件均值比较；改变 ε 方差观察最优函数是否变化。',research:'当不同速度方向被平均后，边缘速度场会不会在多模态区域出现较小速度？',quiz:['在平方损失下，预测 Y 的最优函数（以 X 为输入）是？','条件期望 𝔼[Y|X]','条件众数','无条件方差'],answer:0,why:'平方损失下的正交投影给出条件期望，需二阶可积等常见条件。'}
  ]},
  {n:2,phase:'基础恢复',label:'变量变换与动力系统',subtitle:'把静态概率密度变成随时间演化的分布',color:'#6B79C8',deliverable:'写出一维概率守恒推导，并测量 Euler 方法的全局误差阶。',question:'一个速度场如何真正推动一个概率分布？',lessons:[
    {id:'w2l1',name:'概率密度变换与散度',time:50,tags:['概率','Jacobian'],intro:'在一个可逆的光滑变换下，密度不是直接“沿路径走”，还会因局部体积变化而伸缩。散度描述局部流入和流出。',formula:'p_Y(y)=p_X(f⁻¹(y)) · |det J(f⁻¹)(y)|',explain:'先用一维区间长度变化建立直觉，再推广到高维体积元素；散度是速度场的局部体积膨胀率。',derive:['推导一维 y=ax+b 的密度变换。','对二维线性变换说明 determinant 的物理意义。','算出 v(x,y)=(x,−y) 的散度。'],experiment:'采样二维高斯，施加线性映射，比较理论协方差与样本估计。',research:'对刚体旋转这种体积保持变换，Jacobian determinant 有什么特殊性质？',quiz:['在可逆映射的密度变换中，Jacobian determinant 描述什么？','局部体积变化','最优学习率','向量长度总不变'],answer:0,why:'密度需要乘以逆映射的体积缩放因子才能保证概率质量守恒。'},
    {id:'w2l2',name:'ODE、Euler 与数值误差',time:55,tags:['ODE','数值分析'],intro:'连续生成模型的采样不是一步函数，而是求解初值问题。数值积分误差取决于时间步长，也受向量场的平滑性及稳定性影响。',formula:'dx/dt=v(x,t)；Euler: xₙ₊₁=xₙ+h·v(xₙ,tₙ)',explain:'Euler 每一步用局部切线近似轨迹。对于足够光滑且稳定的问题，Euler 全局误差通常是一阶；Heun 方法通常为二阶。',derive:['对 dx/dt=−λx 写出解析解。','写出 Euler 的递推公式并比较解析解。','解释局部截断误差与全局误差的区别。'],experiment:'运行 labs/lab02_ode_error.py，绘制误差随步长的 log-log 关系。',research:'如果速度场在数据模态交界处非常陡，低 NFE 采样更容易出现什么问题？',quiz:['经典显式 Euler 方法在常规条件下的全局收敛阶数是？','一阶','二阶','四阶'],answer:0,why:'Euler 每步局部截断误差为 O(h²)，常见稳定条件下累积为 O(h)。'},
    {id:'w2l3',name:'连续性方程：概率质量守恒',time:65,tags:['PDE','概率'],intro:'连续性方程是 Flow Matching 的根基：概率质量随着速度场流动，但不会凭空产生或消失。它把样本轨迹和总体分布联系起来。',formula:'∂ₜpₜ(x)+∇·(pₜ(x)vₜ(x))=0',explain:'在区域 Ω 内，概率质量变化率等于穿过边界的负通量；再由散度定理得到 PDE。',derive:['从一维小区间内的质量守恒推导方程。','解释 p·v 与 ∇·(p·v) 各表示什么。','代入一维平移分布 pₜ(x)=p₀(x−ct) 验证方程。'],experiment:'选择固定速度 v(x)=c，画出高斯密度随时间平移并验证总质量近似守恒。',research:'假如生成变量存在不合法区域，边界通量应满足什么条件？',quiz:['连续性方程中 ∇·(p v) 的物理含义是？','概率通量的净流出率','速度的模长','样本熵'],answer:0,why:'散度度量局部净流出，因此时间导数必须与其相反以维持守恒。'}
  ]},
  {n:3,phase:'生成模型核心',label:'Flow Matching：从零推导',subtitle:'把条件路径、边缘场和可学习 loss 串成完整逻辑',color:'#178b88',deliverable:'不查论文，完整推导 conditional FM 与 marginal FM 的关联。',question:'为什么对配对样本做速度回归，可以训练生成向量场？',lessons:[
    {id:'w3l1',name:'条件概率路径与速度目标',time:60,tags:['FM','Probability path'],intro:'给定两端点，选择一条随 t 变化的插值路径。选择路径等于给定一个中间分布族；速度目标是路径对 t 的导数。',formula:'xₜ=(1−t)x₀+t x₁；uₜ=∂ₜxₜ=x₁−x₀',explain:'从生成采样端的时间方向出发，明确 x₀ 是源分布、x₁ 是目标分布；端点与时间的采样方式构成训练分布。',derive:['推导线性插值的目标速度。','用 xₜ=α(t)x₀+β(t)x₁ 计算一般速度。','列出端点约束 α(0),β(0),α(1),β(1)。'],experiment:'在二维两点或高斯分布之间画路径；尝试三种 α、β 函数并对比速度。',research:'物理允许的中间状态空间是否限制插值公式的选择？',quiz:['线性插值 xₜ=(1−t)x₀+tx₁ 的目标速度是多少？','x₁−x₀','xₜ','t(x₁−x₀)'],answer:0,why:'对 t 直接求导即可，端点在条件路径中固定。'},
    {id:'w3l2',name:'条件速度如何变成边缘速度',time:70,tags:['FM','条件期望'],intro:'在相同 xₜ=x 的位置上，可能有许多端点配对通过。模型不需要预测单条隐藏轨迹，而要学习这些条件速度的后验平均。',formula:'vₜ(x)=𝔼[uₜ | xₜ=x]',explain:'条件分布由联合采样过程诱导；利用条件期望和测试函数可以证明边缘路径满足对应的连续性方程。',derive:['写出 xₜ 与端点配对的联合分布关系。','用条件期望恒等式将 𝔼[∇φ(xₜ)·uₜ] 改写成 𝔼[∇φ(xₜ)·vₜ(xₜ)]。','说明需要怎样的可积性/正则性假设。'],experiment:'制作二维交叉路径例子，画出相交区域条件速度的平均方向。',research:'速度平均造成的轨迹弯曲或抵消，能否通过更合适的 coupling 缓解？',quiz:['同一位置 xₜ=x 有多条条件轨迹经过时，最优边缘速度是什么？','条件速度的后验平均','随机选择一条轨迹','所有速度的最大值'],answer:0,why:'平方损失下的最优回归函数是给定 xₜ 时的条件速度期望。'},
    {id:'w3l3',name:'CFM Loss 与生成采样闭环',time:65,tags:['FM','ODE'],intro:'训练时可以用端点和时间直接构造监督，而采样时只需要模型预测的 vθ(x,t) 并求解 ODE。理解训练随机变量与采样状态的角色差异。',formula:'ℒ=𝔼ₜ,ₓ₀,ₓ₁‖vθ(xₜ,t)−(x₁−x₀)‖²',explain:'CFM 与针对边缘场的 MSE 只差一个与模型参数无关的不可约方差项；它们具有相同的最优预测器。',derive:['对目标速度应用条件期望平方损失分解。','解释不可约方差为什么不影响最优解。','写出从 x₀~p₀ 到 x₁≈p₁ 的 ODE 采样步骤。'],experiment:'运行 labs/lab01_flow_matching_2d.py 的 independent 模式，画采样终点与数据分布。',research:'模型逼近误差与求解器误差怎样分别影响最终分布？',quiz:['CFM 与边缘场 MSE 在理想函数类下具有相同最优解的关键是？','条件期望的平方损失投影','两个 loss 逐点完全相同','所有轨迹都不相交'],answer:0,why:'两个风险函数相差与预测器无关的条件方差项，并非逐样本相等。'}
  ]},
  {n:4,phase:'生成模型核心',label:'路径与 Coupling 的设计空间',subtitle:'开始从「读懂公式」走向「主动修改假设」',color:'#178b88',deliverable:'完成 coupling × 时间调度的消融，写出一页解释与可证伪假设。',question:'为什么合法的概率路径并不一定是高效的生成路径？',lessons:[
    {id:'w4l1',name:'Independent 与 OT-like Coupling',time:60,tags:['FM','OT'],intro:'端点边缘分布固定，不代表它们之间的配对方式唯一。不同 coupling 会改变条件路径集合和边缘速度的复杂度。',formula:'π(x₀,x₁)，其两个边缘分布分别为 p₀、p₁',explain:'独立 coupling 取 π=p₀⊗p₁；OT coupling 则在满足边缘约束的条件下优化传输代价。',derive:['写出离散 coupling 的行和、列和约束。','比较独立配对与最小平方距离配对的路径总长度。','思考 minibatch OT 为何只是近似。'],experiment:'在 lab01 中比较 independent 与按坐标排序的启发式配对；注意后者不等于真正 OT。',research:'更短的条件路径是否一定意味着更小的生成质量误差？提出反例。',quiz:['改变 coupling 时，哪些量在理想定义中保持不变？','端点的边缘分布','每条样本路径','所有中间边缘分布'],answer:0,why:'coupling 的定义就是保持两端边缘分布，同时改变联合配对。'},
    {id:'w4l2',name:'时间重参数化与速度大小',time:55,tags:['FM','ODE'],intro:'同一条几何轨迹可以用不同速度走完。时间参数化会影响监督速度尺度、训练权重与数值求解难度。',formula:'xₜ=γ(s(t))；dxₜ/dt=γ′(s(t))·s′(t)',explain:'路径轨迹的像不变，但参数化变化了向量场的时间依赖；不能简单声称某种 schedule 总更好。',derive:['取 s(t)=t²，推导速度。','比较 s(t)=t 和 t² 在 t=0 附近的速度。','说明非均匀时间采样如何改变训练目标权重。'],experiment:'固定端点与网络，对比线性和非线性 schedule 的训练稳定性与 NFE。',research:'如果结构形成过程早期难、后期易，时间调度是否应该非均匀？',quiz:['仅改变平滑单调时间重参数化时，最直接改变的是？','轨迹上的运行速度','轨迹端点','定义域维度'],answer:0,why:'保端点的时间重参数化改动的是经过轨迹各处的时间和速度。'},
    {id:'w4l3',name:'把路径修改写成可检验假设',time:65,tags:['Research','Ablation'],intro:'方法创新不等于改公式。每一个改动需要说明它解决哪类偏差、代价、几何不匹配或数值困难，并确定最小实验。',formula:'假设 → 机制预测 → 可观察指标 → 反例',explain:'把路径直、速度简单、训练稳定、化学有效性等不同指标拆开；不要把“更接近直线”直接等同于“结果更好”。',derive:['为一个路径变体写出端点及边缘保证。','列出该改动可能增加的偏差或计算代价。','设计两组会给出相反预测的 toy 数据。'],experiment:'记录生成误差、trajectory curvature proxy、NFE、训练耗时；多随机种子对比。',research:'你当前药物设计任务的真正瓶颈是哪一项：几何合法性、模式覆盖、条件一致性，还是计算成本？',quiz:['一条好的方法改进假设最需要具备什么？','能被实验反驳的明确预测','漂亮的公式','尽可能多的超参数'],answer:0,why:'可证伪性帮助区分解释性研究与仅凭后验故事解释结果。'}
  ]},
  {n:5,phase:'扩散与随机过程',label:'SDE 与 Fokker–Planck',subtitle:'把随机轨迹和确定性的密度演化联系起来',color:'#5978c6',deliverable:'从简单扩散过程推导出密度随时间变化的 PDE。',question:'样本轨迹有随机性，为什么边缘密度仍遵循确定方程？',lessons:[
    {id:'w5l1',name:'Brownian motion 与噪声尺度',time:55,tags:['SDE','概率'],intro:'布朗运动增量服从均值零、方差与时间长度成正比的正态分布，因此随机波动量级是 √Δt，而非 Δt。',formula:'Wₜ₊ₕ−Wₜ ~ 𝒩(0,hI)',explain:'区分随机过程的一条样本路径与它在某时刻的边缘概率分布；解释为何不能把 dW 直接当普通 dt。',derive:['计算布朗运动增量的均值和协方差。','比较 h 和 √h 在 h→0 时的阶数。','说明为什么 Brownian path 几乎处处不可微。'],experiment:'模拟不同步长 Brownian path，比较终点分布与路径粗糙程度。',research:'当随机强度改变时，探索不同模态和保持局部结构之间有什么权衡？',quiz:['布朗运动在长度 h 时间内的典型增量量级是？','√h','h','h²'],answer:0,why:'增量方差为 h，标准差为 √h。'},
    {id:'w5l2',name:'Itô SDE 与漂移/扩散项',time:65,tags:['SDE','Itô'],intro:'SDE 同时包含确定性的 drift 与随机 noise。理解二阶 Itô 修正项是连接 SDE 与密度方程的必要一步。',formula:'dXₜ=b(Xₜ,t)dt+σ(Xₜ,t)dWₜ',explain:'对于光滑测试函数 φ，Itô 公式除了一阶梯度项，还包含由扩散协方差产生的二阶 Hessian 项。',derive:['写出一维 Itô 公式的漂移修正项。','令 φ(x)=x²，计算简化 SDE 的期望变化。','区分 σ 与扩散矩阵 a=σσᵀ。'],experiment:'实现 Euler–Maruyama，研究随机终点的均值和方差是否与解析表达相符。',research:'若噪声幅度依赖构象位置，如何避免错误地使用常数扩散的直觉？',quiz:['Itô 公式相较普通链式法则多了什么？','扩散导致的二阶导数项','任意三阶项','固定学习率'],answer:0,why:'随机增量的二次变差产生二阶 Itô 修正。'},
    {id:'w5l3',name:'Fokker–Planck 方程',time:70,tags:['PDE','SDE'],intro:'给定一个 SDE，其边缘概率密度一般满足确定性的 Fokker–Planck 方程，包含漂移引起的通量与噪声引起的扩散。',formula:'∂ₜp=−∇·(bp)+½ Σᵢⱼ∂ᵢ∂ⱼ(aᵢⱼp)',explain:'这是一条关于密度的 PDE，而非单条样本的 SDE。常数各向同性扩散时，第二项退化成拉普拉斯算子。',derive:['从 Itô 公式对测试函数求期望。','通过分部积分把导数转移到密度上。','对 b=0、a=2DI 推出热方程。'],experiment:'对纯 Brownian 过程的二维样本做直方图，并与热方程的高斯解对照。',research:'物理系统中的能量诱导 drift 与扩散系数之间应有什么联系，才能有预期稳态？',quiz:['Fokker–Planck 描述的主要对象是？','随时间变化的边缘概率密度','某一条随机样本轨迹','神经网络权重'],answer:0,why:'SDE 约束样本过程，Fokker–Planck 约束其密度演化。'}
  ]},

    {id:'w6l1',name:'Denoising Score Matching',time:65,tags:['Score','Diffusion'],intro:'有噪数据的条件分布可以计算 score，用它训练网络可以学到被扰动数据边缘分布的 score；这依赖条件期望的等式。',formula:'∇ₓ log 𝒩(x; x₀,σ²I)=−(x−x₀)/σ²',explain:'真正需要的边缘 score 是多种潜在干净样本条件 score 的后验平均，而不是某一条样本的 score。',derive:['由高斯扰动写出条件 score。','证明边缘 score 与条件 score 的条件期望关系（在可交换微分与积分条件下）。','说明小噪声与大噪声各自的学习难点。'],experiment:'二维 Gaussian mixture 加噪，训练 score network 并画向量场。',research:'分子局部高频几何和全局拓扑结构是否需要不同噪声尺度？',quiz:['Denoising score matching 的监督目标典型来自哪里？','已知加噪条件分布的 score','真实边缘密度的归一化常数','化学键长度常数'],answer:0,why:'条件加噪核（例如高斯）的 score 可解析计算，避免知道未知边缘密度。'},
    {id:'w6l2',name:'Reverse-time SDE 与 Probability Flow ODE',time:70,tags:['SDE','ODE'],intro:'在适当正则性条件下，已知时间边缘 score 可以构造逆时间随机过程，也可构造具有相同边缘密度演化的确定性 probability flow ODE。',formula:'（g=g(t)）PF-ODE: dx/dt = f(x,t) − ½g(t)² ∇log pₜ(x)',explain:'必须明确时间方向和扩散系数是否依赖 x；一般状态依赖扩散会出现额外的散度相关项。',derive:['在 g=g(t) 的假设下比较 Fokker–Planck 与 PF-ODE 的连续性方程。','解释为什么 ODE 与 SDE 样本轨迹不同但边缘可以相同。','列出逆时间实现时 t 的方向约定。'],experiment:'在解析高斯设置比较 ODE/SDE 的边缘均值和协方差。',research:'有限精度 score 预测下，ODE 和 SDE 的误差传播有哪些可能差别？',quiz:['PF-ODE 与相应 SDE 在理想条件下相同的通常是？','各时刻的边缘分布','每条随机轨迹','采样方差逐步为零'],answer:0,why:'它们可以共享相同边缘密度流，但具体样本轨迹不相同。'},
    {id:'w6l3',name:'数值积分误差与 NFE',time:60,tags:['数值分析','Sampling'],intro:'把理论动力学变为实际采样器，必须分析步长、向量场变化、误差积累和成本。理论上同样的终点分布不代表有限 NFE 的表现相同。',formula:'总体误差 ≈ 模型误差 + 数值离散误差（仅作分析性拆分）',explain:'用同一组场、同一初始分布比较 Euler、Heun 和更高阶方法；留意刚性、时间变化和端点行为。',derive:['估计一个一阶线性 ODE 的 Euler 全局误差。','解释为什么 NFE 比采样步数更公平。','给出何时高阶求解器未必划算的例子。'],experiment:'运行 lab02；再在 lab01 的训练模型上实现 Euler/Heun 对比终点质量与运行时间。',research:'你当前模型是否在少量关键时间段发生大多数采样误差？',quiz:['比较不同 ODE 求解器的计算成本通常更应该观察？','NFE（向量场评估次数）','代码行数','GPU 型号名称'],answer:0,why:'一次高阶步骤可能调用多次向量场，单纯步数不能代表计算成本。'}

    {id:'w7l1',name:'群作用、Invariant 与 Equivariant',time:60,tags:['几何','Equivariance'],intro:'Invariant 指输出不随某种对称变换改变；Equivariant 则指输入变换会引起输出以规定方式变换。结构预测与生成要小心区分两者。',formula:'f(g·x)=ρ(g)·f(x)',explain:'标量能量通常应对整体旋转不变；坐标或速度向量一般应随旋转等变。镜像对称与手性则需要分别处理。',derive:['写出一个点云质心与两点距离的变换性质。','验证旋转作用下向量场的等变条件。','说明只要求 O(3) 等变可能带来的手性风险。'],experiment:'给三维构象随机旋转，测试模型输出的数值等变误差。',research:'药物分子具有手性，模型应严格施加哪些对称性，哪些不应施加？',quiz:['预测一个标量分子能量时，对整体旋转的合理要求通常是？','不变性 invariant','输出向量跟着旋转','能量加倍'],answer:0,why:'标量能量通常不依赖坐标系方向；预测位置/力则需要考虑等变性。'},

{id:'d1',title:'为什么 MSE 的最优解是条件期望？',theme:'概率基础',difficulty:'基础',problem:'给定二阶可积的随机变量 (X,Y)，证明 argmin_f 𝔼‖Y−f(X)‖² = 𝔼[Y|X]，并解释该结果如何用于 CFM。',hints:['定义 m(X)=𝔼[Y|X]。','写出 Y−f(X)=(Y−m(X))+(m(X)−f(X))。','条件期望下交叉项为什么为零？'],solution:['展开平方并取期望。','交叉项 𝔼[(Y−m(X))ᵀ(m(X)−f(X))]=0，因为第二因子是 X 的函数，且 𝔼[Y−m(X)|X]=0。','所以风险 = 𝔼‖Y−m(X)‖² + 𝔼‖m(X)−f(X)‖²，最小值由 f=m 取得（几乎处处）。','令 X=(xₜ,t)、Y=uₜ，得到理想边缘场 vₜ(x)=𝔼[uₜ|xₜ=x]。']},
{id:'d2',title:'从样本流推导连续性方程',theme:'生成动力学',difficulty:'进阶',problem:'令 xₜ 满足 dxₜ/dt=vₜ(xₜ)。用光滑紧支撑测试函数 φ，推导 ∂ₜpₜ+∇·(pₜvₜ)=0 的弱形式。',hints:['考虑 d/dt 𝔼[φ(xₜ)]。','用链式法则得到 𝔼[∇φ(xₜ)·vₜ(xₜ)]。','对空间积分分部积分。'],solution:['对任意 φ，d/dt∫φ(x)pₜ(x)dx=∫∇φ(x)·vₜ(x)pₜ(x)dx。','若边界项消失，则右边 = −∫φ(x)∇·(pₜvₜ)dx。','因此 ∫φ(x)[∂ₜpₜ+∇·(pₜvₜ)]dx=0。','对所有测试函数成立即得到分布意义下的连续性方程；经典意义还需更多光滑性。']},
{id:'d3',title:'从高斯密度算出 Score',theme:'Diffusion',difficulty:'基础',problem:'对 X~𝒩(μ,Σ)，推导 ∇ₓ log p(x)。然后求高斯噪声核 q(x|x₀)=𝒩(x₀,σ²I) 的 score。',hints:['先只写与 x 有关的 log density 项。','对二次型 (x−μ)ᵀΣ⁻¹(x−μ) 求导。','Σ 必须对称正定。'],solution:['log p(x)=常数−½(x−μ)ᵀΣ⁻¹(x−μ)。','Σ⁻¹ 对称，二次型的梯度为 2Σ⁻¹(x−μ)。','所以 ∇ₓlog p(x)=−Σ⁻¹(x−μ)。','对 σ²I，得到 −(x−x₀)/σ²，直接构成 DSM 的条件监督。']},
{id:'d4',title:'PF-ODE 为什么共享 SDE 的边缘分布？',theme:'Diffusion',difficulty:'挑战',problem:'考虑 dX=f(X,t)dt+g(t)dW（g 只依赖 t），把 Fokker–Planck 改写成连续性方程，识别对应的确定性 velocity。',hints:['对应 FP 是 ∂ₜp=−∇·(fp)+(g²/2)Δp。','利用 p∇log p=∇p。','整理为 −∇·(pv) 的形式。'],solution:['FP: ∂ₜp=−∇·(fp)+½g(t)²Δp。','因为 Δp=∇·(p∇log p)，右边等于 −∇·{p[f−½g²∇log p]}。','因此可取 v=f−½g²∇log p，得到与 FP 相同的密度 PDE。','这是正向时间方程；反向采样需显式处理时间方向。若扩散系数依赖 x，公式必须修改。']},
{id:'d5',title:'为什么旋转矩阵不能普通线性插值？',theme:'三维几何',difficulty:'进阶',problem:'给定 R₀=I，R₁ 为绕 z 轴旋转 90° 的矩阵。检查 R(½)=(R₀+R₁)/2 的正交性与行列式。',hints:['写出 R₁ 在 xy 平面上的 2×2 旋转块。','计算中点矩阵的 RᵀR。','再对比 R₀ Exp(½ Log(R₀ᵀR₁))。'],solution:['R₁ 的 xy 块是 [[0,−1],[1,0]]。','中点 xy 块为 [[0.5,−0.5],[0.5,0.5]]，其 AᵀA=0.5I，因此并非正交矩阵。','中点行列式为 0.5，而 SO(3) 需要 det=1。','在该例中，Lie group 插值给出绕 z 轴旋转 45° 的合法旋转。']},
{id:'d6',title:'改变 Coupling，会改变什么？',theme:'Optimal Transport',difficulty:'挑战',problem:'用一个两点一维分布示例，构造两种合法 coupling，比较平方位移成本、插值路径以及中间分布。',hints:['取源点 −1、1 与目标点 −2、2，各自概率 ½。','比较同号配对与反号配对。','按 t=½ 计算中间样本位置。'],solution:['同号配对：−1→−2、1→2，平方位移成本均为 1，期望成本=1；中点在 −1.5 和 1.5。','反号配对：−1→2、1→−2，平方位移成本均为 9，期望成本=9；中点均在 0。','两种 coupling 都具有相同端点边缘分布，但中间分布与目标速度显著不同。','因此 coupling 会改变学习问题的难度和数值几何；但低 transport cost 不自动保证下游任务最好。']}

 sections:[
 {title:'0. 函数到底在映射什么？',html:`<p>我们先把函数视为一个<strong>带输入/输出类型的映射</strong>。若 <span class="math-inline">f: ℝⁿ → ℝ</span>，输入是 n 维向量、输出是标量；若 <span class="math-inline">g: ℝⁿ → ℝᵐ</span>，输出是 m 维向量。这决定了导数的形状。</p><p>例如 <code>f(x₁,x₂)=x₁²+3x₁x₂</code> 是 <span class="math-inline">ℝ² → ℝ</span>，而 <code>g(x₁,x₂)=(x₁²,x₁x₂)</code> 是 <span class="math-inline">ℝ² → ℝ²</span>。</p>`},
 {title:'1. 偏导数 → 全微分 → 梯度',html:`<p><strong>偏导数</strong> <code>∂f/∂xᵢ</code>：固定其他分量，只改变第 i 个输入，观察 f 的变化率。</p><p><strong>全微分（局部线性近似）</strong>：若 f 在 x 处可微，足够小的变化 h 满足 <span class="math-display">f(x+h) = f(x) + ∇f(x)ᵀ h + o(‖h‖)</span>。这里 <code>∇f(x)∈ℝⁿ</code> 按<strong>列向量</strong>约定，<code>∇f(x)ᵀh</code> 是标量。</p><p><strong>梯度</strong> <span class="math-inline">∇f=(∂f/∂x₁,…,∂f/∂xₙ)ᵀ</span>，是标量函数的一阶变化在标准欧氏内积下的表示。其方向是局部最速上升方向（使用标准欧氏范数衡量方向的长度）。</p>`},
 {title:'2. Jacobian：向量值函数的导数',html:`<p>当 <span class="math-inline">g: ℝⁿ→ℝᵐ</span>，每个输出都有自己的偏导。把它们堆成一个矩阵：</p><div class="math-display">J<sub>g</sub>(x) = [∂gᵢ/∂xⱼ] ∈ ℝ<sup>m×n</sup></div><p>在这个约定下，<span class="math-inline">g(x+h)≈g(x)+J<sub>g</sub>(x)h</span>。所以 Jacobian 是一个<strong>把输入扰动映射为输出扰动</strong>的线性算子，而不只是偏导数组成的表格。</p><p>当 m=1 时，<code>J_f = ∇fᵀ</code>；注意 <strong>Jacobian 是行向量，gradient 是列向量</strong>（在本课程的约定下）。</p>`},
 {title:'3. 链式法则为什么是矩阵乘法？',html:`<p>设 <span class="math-inline">g: ℝⁿ→ℝᵐ，f: ℝᵐ→ℝᵏ</span>。先扰动输入 <code>h∈ℝⁿ</code>，第一层变化近似 <code>J_g h∈ℝᵐ</code>，第二层近似 <code>J_f(J_g h)∈ℝᵏ</code>，所以：</p><div class="math-display">J<sub>f∘g</sub>(x)=J<sub>f</sub>(g(x)) · J<sub>g</sub>(x)</div><p>尺寸验证：<code>(k×m)·(m×n)=(k×n)</code>。若末端 f 输出标量，则也可写为 <span class="math-inline">∇<sub>x</sub>f(g(x))=J<sub>g</sub>(x)ᵀ ∇<sub>z</sub>f(z)|<sub>z=g(x)</sub></span>。这就是 reverse-mode autodiff / backpropagation 的基本结构。</p><p><strong>马上用于生成模型：</strong>取 <code>F(x)=log p(g(x))</code>，设 <code>g:ℝⁿ→ℝᵐ</code>。先在中间变量 z=g(x) 上计算 <code>s(z)=∇_z log p(z)∈ℝᵐ</code>，再乘 <code>J_g(x)ᵀ∈ℝⁿˣᵐ</code>，便得到 <code>∇ₓF(x)=J_g(x)ᵀs(g(x))∈ℝⁿ</code>。注意这只是标量复合函数的梯度，不要与密度变量变换公式混淆。</p>`},
 {title:'4. Hessian：梯度再求一次导',html:`<p>若标量函数二阶可微，<strong>Hessian</strong> 是梯度的 Jacobian：<span class="math-inline">H<sub>f</sub>(x)=[∂²f/∂xᵢ∂xⱼ]∈ℝⁿˣⁿ</span>。它描述梯度如何随 x 改变，也出现在二阶 Taylor 近似中：</p><div class="math-display">f(x+h)≈f(x)+∇f(x)ᵀh+½hᵀH<sub>f</sub>(x)h</div><p>若混合偏导连续，Hessian 对称。不要把 Hessian 与 Jacobian 混为一谈：Hessian 只针对标量函数的二阶变化。</p>`}
 ],
 worked:{title:'完整例题：从二次损失独立推到梯度',lines:[
 '给定 A∈ℝᵐˣⁿ，x∈ℝⁿ，b∈ℝᵐ；令 r(x)=Ax−b∈ℝᵐ，f(x)=‖r(x)‖²=rᵀr。',
 '对输入做微小扰动 dx，先得到 dr=A dx（因为 A、b 都是常量）。',
 '对 f=rᵀr 求微分：df=(dr)ᵀr+rᵀdr=2rᵀdr。',
 '代回 dr：df=2rᵀA dx = [2Aᵀr]ᵀdx。',
 '对照 df=(∇ₓf)ᵀdx，得 ∇ₓf=2Aᵀ(Ax−b)∈ℝⁿ。',
 '继续求导：H_f=2AᵀA∈ℝⁿˣⁿ。它是半正定的；A 满列秩时正定。'
 ]},
 mistakes:['把 ∇f 与 J_f 当成同形状对象；本课程约定下它们互为转置。','只凭背诵把 Aᵀ 写成 A；写出每个变量的形状可以快速发现错误。','把局部线性近似当成精确等式；除非函数本身线性，否则必须考虑高阶误差。'],
 challenge:'若 A 不是常量，而是 A(x)，公式 ∇ₓ‖A(x)x−b‖² 还能直接写成 2Aᵀ(Ax−b) 吗？指出被忽略的导数。',
 anchor:'与生成模型的关联：Score 是 ∇ₓlog p(x)；Flow Matching 中对向量场求 Jacobian 可以分析 divergence 与采样敏感性。'
 },
 w1l2:{
 readiness:['我能区分随机向量 X 和一次采样的具体值 x','我知道均值、方差与协方差的区别','我能求上一单元的二次型梯度'],
 sections:[
 {title:'0. 从随机向量开始',html:`<p><strong>随机变量</strong>不是某次样本值。<span class="math-inline">X∈ℝᵈ</span> 表示一个随机向量，<span class="math-inline">x∈ℝᵈ</span> 是它可能取到的值。概率密度 <code>p(x)</code> 是关于 x 的函数；连续变量“取到精确某个点”的概率通常是 0。</p><p><strong>均值</strong> <span class="math-inline">μ=E[X]</span> 表示中心；<strong>协方差矩阵</strong> <span class="math-inline">Σ=E[(X−μ)(X−μ)ᵀ]</span> 的元素 Σᵢⱼ 描述不同坐标的共同变化。Σ 的形状为 d×d，是对称半正定矩阵。</p>`},
 {title:'1. 多元高斯概率密度',html:`<p>当 Σ <strong>对称正定</strong>时，非退化多元高斯密度为：</p><div class="math-display">p(x) = (2π)<sup>−d/2</sup> |Σ|<sup>−1/2</sup> exp{−½(x−μ)ᵀΣ<sup>−1</sup>(x−μ)}</div><p>其中 <code>(x−μ)ᵀΣ⁻¹(x−μ)</code> 是一个标量；它不是简单的欧氏距离，而是考虑不同坐标尺度和相关性的<strong>马氏距离平方</strong>。当 Σ=σ²I 时，才退化成 ‖x−μ‖²/σ²。</p>`},
 {title:'2. Score 的定义与含义',html:`<p><strong>Score</strong> 是对数据位置 x 求 log density 的梯度（不是对模型参数求梯度）：</p><div class="math-display">s(x) = ∇<sub>x</sub> log p(x)</div><p>它回答“沿哪个方向，log 密度增长最快”。对高斯：<span class="math-inline">s(x)=−Σ⁻¹(x−μ)</span>。协方差越小的方向，同样偏移产生越大的 score 分量。</p>`},
 {title:'3. 为什么要对 log p 求导？',html:`<p>把密度取对数，高斯中的指数会转为二次型：<span class="math-inline">log p(x)=C−½(x−μ)ᵀΣ⁻¹(x−μ)</span>。其中 C 对 x 为常量，求导时消失。注意：训练时参数也可能决定 Σ，但此处我们只对 x 求导、将 μ 和 Σ 视为固定。</p>`}
 ],
 worked:{title:'完整例题：推导多元高斯的 Score',lines:[
 '取 log：log p(x)=−d/2 log(2π)−½log|Σ|−½(x−μ)ᵀΣ⁻¹(x−μ)。',
 '设 z=x−μ，B=Σ⁻¹；对 x 求导时，前两个归一化项是常量。',
 '因为 B 对称，∇ₓ(zᵀBz)=(B+Bᵀ)z=2Bz。',
 '所以 ∇ₓlog p(x)=−Σ⁻¹(x−μ)。',
 '特例：Σ=σ²I，得到 score=−(x−μ)/σ²。x=μ 时 score 为 0。',
 '检查尺度：σ 增大一倍、x−μ 固定时，score 的大小变为原来的 1/4。'
 ]},
 mistakes:['对 x 求梯度与对参数 μ、Σ 求梯度完全是不同问题。','Σ 不可逆时，上述“在 ℝᵈ 上非退化密度”的公式不能直接使用。','不要将 score 的大小直接解释为“概率”；它是 log 密度的空间变化率。'],
 challenge:'如果把各向同性 Σ=σ²I 改为对角阵 diag(σ₁²,…,σ_d²)，不同坐标的 score 缩放有何变化？这对不同量纲的分子特征有什么启示？',
 anchor:'与 Diffusion 的关联：DSM 用高斯噪声核的条件 score 构造监督；但学到边缘 score 还需要条件期望联系。'
 },
 w1l3:{
 readiness:['我能区分联合分布 p(x,y) 和条件分布 p(y|x)','我知道随机变量的期望与平方损失','我理解“给定 X 时，Y 仍可能随机”'],
 sections:[
 {title:'0. 条件期望不是“代入一个数”',html:`<p>给定随机变量 X、Y，<strong>条件期望</strong> <span class="math-inline">m(X)=E[Y|X]</span> 本身是 X 的函数（也是一个随机变量）。记 <span class="math-inline">m(x)=E[Y|X=x]</span>，若存在适当条件密度，可以写为 <span class="math-inline">m(x)=∫y·p(y|x)dy</span>。</p><p>例子：假设 Y=X+ε，且 E[ε|X]=0，则 E[Y|X]=X。即使知道 X，Y 仍带噪声；条件期望只给出其条件均值。</p>`},
 {title:'1. Tower property（全期望公式）',html:`<p>如果相应期望存在，<span class="math-inline">E[E[Y|X]]=E[Y]</span>。更一般地，若 h(X) 是可积的 X 的函数，则 <span class="math-inline">E[h(X)Y]=E[h(X)E[Y|X]]</span>（适当的可积性条件下）。</p><p>这使得我们可以用只依赖 X 的函数，把隐藏的 Y 替换成条件平均。这一步在 Conditional Flow Matching 的理论里反复出现。</p>`},
 {title:'2. MSE 与条件期望的连接',html:`<p>考虑所有满足适当二阶可积条件的预测器 f(X)，使平方损失最小：</p><div class="math-display">min<sub>f</sub> E[‖Y−f(X)‖²]</div><p>关键不需要先计算导数。设 <span class="math-inline">m(X)=E[Y|X]</span>，利用残差分解和交叉项为零，把损失写成：</p><div class="math-display">E[‖Y−f(X)‖²] = E[‖Y−m(X)‖²] + E[‖m(X)−f(X)‖²]</div><p>第一项与 f 无关，第二项非负，故最优解是 <span class="math-inline">f*(X)=m(X)</span>（几乎处处）。这是一条<strong>正交投影</strong>结构，而不是神经网络的特殊性质。</p>`},
 {title:'3. 什么时候这个结论不能直接用于模型？',html:`<p>结论针对允许的所有平方可积函数。实际神经网络的函数空间受架构限制，优化也未必达到全局最优；因此不能直接声称训练后的网络“严格等于”条件期望。</p><p>改用 L1 损失时，最优的是条件中位数（可不唯一），不再通常等于条件均值。这意味着更换 FM loss 需要重新检查目标速度场的理论性质。</p>`}
 ],
 worked:{title:'完整例题：证明 MSE 最优解是条件期望',lines:[
 '令 m(X)=E[Y|X]；写出 Y−f(X)=[Y−m(X)]+[m(X)−f(X)]。',
 '展开平方范数，得到两项平方以及交叉项 2(Y−m)ᵀ(m−f)。',
 '由于 m(X)−f(X) 是 X 的函数，交叉项的期望为 E[ (m−f)ᵀ E[Y−m|X] ]。',
 '按照条件期望的定义 E[Y−m(X)|X]=0，所以交叉项为零。',
 '因此风险等于不可约项 E‖Y−m‖² 与非负项 E‖m−f‖² 之和。',
 '令 f=m 即取得最小值，结论在输入分布意义下几乎处处成立。'
 ]},
 mistakes:['E[Y|X] 是 X 的函数，不是一个脱离 X 的常数。','条件期望是“在给定信息下的均值”，不是说每条样本路径都以这个速度运动。','实际有限参数网络只能逼近这一最优解，不能自动获得理想模型的全部理论保证。'],
 challenge:'在 FM 中令 Y=U_t，X=(X_t,t)，说明 v*(x,t)=E[U_t|X_t=x,t]。如果把 MSE 改为 L1，为什么不能直接沿用原有边缘向量场证明？',
 anchor:'与 Flow Matching 的关联：理想 CFM 回归学习的是给定 (X_t,t) 的条件平均速度，而不是任意一条样本配对轨迹的速度。'
 }
};

function officialPdfWidget(l){
 const sources=READING_PLAN[l.id]||[],list=[],visited=new Set();
 function add(title,chapter,url,type){
   if(!url||visited.has(url))return;
   visited.add(url);list.push({title,chapter,url,type});
 }
 for(const ref of sources){
   const url=OFFICIAL_PDFS[ref[4]];
   if(url)add(ref[1],ref[2],url,'作者 / 学校官方完整 PDF');
   if(ref[4]===SOURCE.geometry)add('Geometric Deep Learning · proto-book','群作用、等变性和几何建模的经典综述','https://arxiv.org/pdf/2104.13478','arXiv 官方 PDF');
   if(ref[4]===SOURCE.geometry)add(
     'Mathematical Foundations of Geometric Deep Learning',
     '对称性、群与微分几何；补充论文，不是 GDL 教材本身的 PDF',
     'https://arxiv.org/pdf/2508.02723','arXiv 官方 PDF');
 }
 if(l.id==='w1l1')add('Stanford CS229 · Linear Algebra Review','矩阵、转置与微积分常用符号','https://cs229.stanford.edu/lectures-spring2022/cs229-linear_algebra_review.pdf','Stanford 官方 PDF');
 if(l.id==='w1l2'||l.id==='w1l3')add('Stanford CS229 · Probability Review','随机变量、期望、条件概率和高斯分布','https://cs229.stanford.edu/lectures-spring2022/cs229-probability_review.pdf','Stanford 官方 PDF');
 if(!list.length)return '';
 return '<div style="margin:12px 0 18px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)">'
 +'<strong style="font-size:13px">📚 官方完整 PDF · 不需裁剪的高质量参考</strong>'
 +'<p style="font-size:11px;color:var(--muted)">直接打开作者、学校或 arXiv 提供的 PDF，不将未经允许的原文复制到本仓库；按所示章节阅读即可。</p>'
 +list.map(x=>'<div style="margin:9px 0 0;padding-top:8px;border-top:1px solid var(--line)">'
  +'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" style="color:var(--brand);font-size:13px;font-weight:650">↗ '+esc(x.title)+'</a>'

async function refreshLocalPdfManifest(){
 try{
  const r=await fetch('readings/manifest.json',{cache:'no-cache'});
  if(!r.ok)return;
  const m=await r.json();
  localPdfManifest=Object.fromEntries((m.files||[]).map(x=>[x.path,x]));
  if(location.hash.includes('lesson'))render();
 }catch(e){/* local file mode: use official source URLs */ }

function roadmap(){return `<div class="eyebrow">CURRICULUM / 12-WEEK ROADMAP</div><h1>研究型数学学习路线</h1><p class="lead">36 个知识单元，按研究杠杆而非传统课程章节组织。每个单元都包含概念直觉、关键公式、独立推导、代码实验和科研问题。建议每周 7–9 小时；完成时间取决于你的已有基础。</p><div class="weekly-grid" style="margin-top:28px">${WEEKS.map(w=>{const [s,c]=statusFor(w);return `<button data-go="week/${w.n}" class="week-card"><div class="week-head"><span class="week-no" style="color:${w.color}">WEEK ${String(w.n).padStart(2,'0')}</span><span class="status-chip ${c}">${s}</span></div><h3>${esc(w.label)}</h3><p>${esc(w.subtitle)}</p><div class="progress"><span style="width:${wcount(w)/3*100}%"></span></div><div class="week-bottom"><span>${esc(w.phase)}</span><span>${wcount(w)}/3 单元</span></div></button>`}).join('')}</div><section class="section"><div class="research-card"><strong>建议使用方式</strong><p style="margin:8px 0 0">每个知识点先花 15–20 分钟自己写定义与推导。卡住时回到“知识图谱”补前置知识；完成后做一项最小实验。每周的真正交付物，是一份你能向合作者讲清楚的数学解释或实验结论。</p></div></section>${foot()}`}
function weekPage(n){const w=weekBy(n);if(!w)return roadmap();const links=REFERENCES.filter(r=>r.week.split('–').some(()=>false)|| (r.week.match(/\d+/g)||[]).some(x=>Number(x)===n) || (()=>{const a=r.week.match(/W(\d+)–(\d+)/);return a&&n>=+a[1]&&n<=+a[2]})());return `<div class="breadcrumbs"><button data-go="roadmap">12 周路线</button><span> / </span><span>Week ${n}</span></div><div class="eyebrow" style="color:${w.color}">${esc(w.phase)} / WEEK ${String(n).padStart(2,'0')}</div><h1>${esc(w.label)}</h1><p class="lead">${esc(w.subtitle)}</p><div class="tags"><span class="badge brand">${wcount(w)}/3 单元已完成</span><span class="badge">预计每周 7–9 小时</span></div>
${n===1?'<div class="course-start"><strong>本周开始方式：先读，再推。</strong><p>每个学习单元开头都新增了精确的教材章节和中文讲义。若基础概念已经模糊，先完成页面内的定义与分步例题；第一周不必先看完整本教材。</p></div>':''}<div class="split section"><div class="panel"><h3>本周的三个学习单元</h3>${w.lessons.map((l,i)=>`<button data-go="lesson/${l.id}" class="list-row"><span class="lesson-no">${n}.${i+1}</span><span class="rowcopy"><strong>${esc(l.name)}</strong><small>${esc(l.tags.join(' · '))} · 约 ${l.time} 分钟核心学习</small></span><span class="check ${state.done[l.id]?'done':''}">${state.done[l.id]?icon('check',19):'○'}</span></button>`).join('')}</div><div><div class="panel soft"><div class="eyebrow">本周重点问题</div><h3 style="font-size:17px;margin-top:10px">${esc(w.question)}</h3><p>不要急于看答案。尝试独立推导并向非该方向研究者解释。</p></div><div class="panel" style="margin-top:16px"><div class="eyebrow">本周交付成果</div><p style="margin:12px 0 4px">${esc(w.deliverable)}</p><button class="link-button" data-go="derivations">进入推导工作台 ${icon('arrow',13)}</button></div></div></div>
<section class="section"><div class="section-heading"><h2>建议阅读材料</h2><button class="link-button" data-go="resources">全部参考资料 ${icon('arrow',13)}</button></div><div class="resources-grid">${(links.length?links:REFERENCES.slice(0,2)).slice(0,4).map(r=>resourceCard(r)).join('')}</div></section><div class="btnrow" style="justify-content:space-between;margin-top:30px"><button class="btn outline" data-go="week/${Math.max(1,n-1)}" ${n===1?'disabled':''}>上一周</button><button class="btn" data-go="week/${Math.min(12,n+1)}" ${n===12?'disabled':''}>下一周 ${icon('arrow')}</button></div>${foot()}`}
function lessonPage(id){const l=byId(id);if(!l)return roadmap();const w=weekBy(l.week),i=LESSONS.findIndex(x=>x.id===id),qstate=state.quiz[id];return `<div class="breadcrumbs"><button data-go="roadmap">学习路线</button><span> / </span><button data-go="week/${w.n}">Week ${w.n}</button><span> / </span>${esc(l.name)}</div><div class="lesson-layout"><main class="lesson-main"><div class="eyebrow">WEEK ${String(w.n).padStart(2,'0')} / UNIT ${l.index} · ${esc(w.phase)}</div><h1 style="font-size:32px">${esc(l.name)}</h1><p class="lead">${esc(l.intro)}</p><div class="tags">${l.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}<span class="badge">约 ${l.time} 分钟</span>${state.done[id]?'<span class="badge brand">✓ 已完成</span>':''}</div>${referenceSection(l)}${courseSection(l)}
<section id="intuition" class="lesson-block anchor"><h3><span class="dot"></span>01 / 核心理解</h3><p>${esc(l.explain)}</p><div class="formula-box">${esc(l.formula)}</div><div class="callout"><b>学习要求：</b>不只知道公式长什么样；要能指出变量的含义、必要条件，以及在哪些情况下公式不再直接成立。</div></section>
<section id="derivation" class="lesson-block anchor"><h3><span class="dot"></span>02 / 必做推导任务</h3><p>先读本单元的内置讲义与指定章节，再独立完成以下推导；卡住时使用上方分步例题。每一步都应能说出依据。</p><ol class="step-list">${l.derive.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>
<section id="experiment" class="lesson-block anchor"><h3><span class="dot"></span>03 / 最小计算实验</h3><p>${esc(l.experiment)}</p><div class="callout">优先用二维数据、解析分布或小型 PyTorch 模型；实验重点是验证公式与机制，而不是刷新 benchmark。</div><button class="link-button" style="margin-top:10px" data-go="resources">查看代码与参考资源 ${icon('arrow',13)}</button></section>
<section id="research" class="lesson-block anchor"><h3><span class="dot"></span>04 / 研究者视角：质疑一个假设</h3><div class="research-card"><strong>本单元研究思考题</strong><p>${esc(l.research)}</p><button class="link-button" data-go="lab" style="padding:0">把思考扩展为研究假设 ${icon('arrow',13)}</button></div></section>
<section id="quiz" class="lesson-block anchor"><h3><span class="dot"></span>05 / 理解自测</h3><p><b style="color:var(--ink)">${esc(l.quiz[0])}</b></p>${answerOrder(l).map((k,vis)=>`<button class="question-opt ${qstate===k?'chosen':''} ${qstate!==undefined&&qstate===k&&k!==l.answer?'wrong':''}" data-quiz="${id}" data-option="${k}"><b>${'ABC'[vis]}.</b> ${esc(l.quiz[1+k])}</button>`).join('')}${qstate!==undefined?`<div class="question-feedback">${qstate===l.answer?'✓ 回答正确。':'这次没有选对。'} ${esc(l.why)}</div>`:''}</section>
<section id="notes" class="lesson-block anchor"><h3><span class="dot"></span>06 / 我的推导与研究笔记</h3><p>建议记录：你卡在哪一行、填补了哪个基础概念、能否提出反例、实验是否支持直觉。这里的内容自动保存在当前浏览器。</p><textarea class="notes-input" data-note="${id}" placeholder="例如：\n1. 关键推导及每一步的假设……\n2. 哪里卡住？我查了什么知识？\n3. 能否改变一个条件，预测结果？">${esc(state.notes[id]||'')}</textarea><div class="tiny muted" style="margin-top:8px">自动保存到本地浏览器；重要笔记建议到“设置与备份”导出。</div></section>
<div class="panel" style="margin-top:17px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px"><label class="finished"><input class="checkbox" data-complete="${id}" type="checkbox" ${state.done[id]?'checked':''}> 我已完成推导、实验与思考</label><div class="btnrow" style="margin:0"><button class="btn outline small-btn" data-go="${i>0?'lesson/'+LESSONS[i-1].id:'week/'+w.n}" ${i===0?'disabled':''}>上一单元</button><button class="btn small-btn" data-go="${i<LESSONS.length-1?'lesson/'+LESSONS[i+1].id:'roadmap'}">${i<LESSONS.length-1?'下一单元':'返回路线'} ${icon('arrow',13)}</button></div></div></main>
<aside class="lesson-aside"><div class="sticky-card"><div class="eyebrow">当前单元</div><h3 style="margin-top:8px">${w.n}.${l.index} · ${esc(l.name)}</h3><div class="progress" style="margin:12px 0"><span style="width:${wcount(w)/3*100}%"></span></div><div class="tiny muted">本周已完成 ${wcount(w)} / 3 个知识单元</div></div><div class="sticky-card"><div class="aside-title">在本页导航</div><ul class="aside-list">${[['readings','具体教材'],['course','中文讲义'],['worked','分步例题'],['intuition','核心理解'],['derivation','独立推导'],['experiment','最小实验'],['research','研究者视角'],['quiz','理解自测'],['notes','我的笔记']].map(([anchor,label])=>`<li><button data-scroll="${anchor}">${label}</button></li>`).join('')}</ul></div><div class="sticky-card"><div class="aside-title">方法提示</div><p class="tiny muted" style="margin:0">1. 不查答案独立推导<br>2. 验证特殊情况<br>3. 修改一个条件<br>4. 写出可证伪预测</p></div></aside></div>${foot()}`}
function conceptsPage(){const groups=['全部',...new Set(CONCEPTS.map(c=>c.group))];const arr=conceptFilter==='全部'?CONCEPTS:CONCEPTS.filter(c=>c.group===conceptFilter);return `<div class="eyebrow">KNOWLEDGE GRAPH / PREREQUISITES</div><h1>数学知识图谱</h1><p class="lead">不是让你从高等数学第一页重学，而是定位推导中缺失的概念，并知道它如何服务真实模型。点击任意知识节点，进入对应的训练单元。</p><div class="filterbar">${groups.map(g=>`<button class="filter ${conceptFilter===g?'active':''}" data-filter="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="concept-grid">${arr.map(c=>`<button data-go="lesson/${c.lesson}" class="concept"><div style="display:flex;justify-content:space-between"><span class="badge brand">${esc(c.group)}</span><span class="badge ${c.priority==='必修'?'warn':''}">${esc(c.priority)}</span></div><h3>${esc(c.name)}</h3><p>${esc(c.why)}</p><small>前置：${esc(c.deps)}</small><div class="tiny" style="color:var(--brand);margin-top:12px;font-weight:700">进入学习单元 →</div></button>`).join('')}</div>${foot()}`}
function derivationsPage(){return `<div class="eyebrow">PROOF WORKBENCH / REBUILD THE INTUITION</div><h1>推导工作台</h1><p class="lead">六道高杠杆推导题，从条件期望到 SO(3) 与 OT。每道题都提供递进提示与参考推导；先独立尝试，再逐层打开提示。</p><div class="derive-grid" style="margin-top:26px">${DERIVATIONS.map((d,i)=>`<div class="derive-item"><div style="display:flex;justify-content:space-between;gap:8px"><span class="badge brand">${esc(d.theme)}</span><span class="badge">${esc(d.difficulty)}</span></div><h3 style="margin-top:15px">${String(i+1).padStart(2,'0')} / ${esc(d.title)}</h3><p>${esc(d.problem)}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="tiny" style="color:var(--brand)">${state.derivations[d.id]?'✓ 已记录推导':''}</span><button class="btn outline small-btn" data-go="derivation/${d.id}">开始推导 ${icon('arrow',13)}</button></div></div>`).join('')}</div>${foot()}`}
function derivationPage(id){const d=DERIVATIONS.find(x=>x.id===id);if(!d)return derivationsPage();return `<div class="breadcrumbs"><button data-go="derivations">推导工作台</button><span> / </span>${esc(d.title)}</div><div class="derive-detail"><div class="eyebrow">PROOF EXERCISE / ${esc(d.difficulty)}</div><h1>${esc(d.title)}</h1><div class="tags"><span class="badge brand">${esc(d.theme)}</span><span class="badge">建议不查答案先推 20–30 分钟</span></div><div class="lesson-block"><h3>你需要证明 / 解释的问题</h3><p>${esc(d.problem)}</p></div><div class="lesson-block"><h3>写下你的推导</h3><p>把你的思路、失败尝试和反例记录下来。再次复习时，先折叠下面的提示和参考答案。</p><textarea class="notes-input" data-derive="${d.id}" style="min-height:245px" placeholder="从这里开始……">${esc(state.derivations[d.id]||'')}</textarea></div><details class="accordion"><summary>逐级提示（卡住时再打开）</summary><div><ol>${d.hints.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></details><details class="accordion"><summary>参考推导（先独立完成再核对）</summary><div><ol>${d.solution.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><b>自测：</b>关闭答案，能否在空白纸上独立复现并解释假设？</p></div></details><div class="btnrow"><button class="btn outline" data-go="derivations">返回全部推导</button><button class="btn" data-go="lab">把疑问转化为研究假设 ${icon('arrow')}</button></div></div>${foot()}`}
function labPage(){return `<div class="eyebrow">RESEARCH LAB / HYPOTHESIS TO EXPERIMENT</div><h1>研究假设实验室</h1><p class="lead">专门培养把“数学直觉上应该改进”转化为明确研究问题的能力。每一个想法都需要一条假设、一项预测、一种反例以及一个能执行的最小实验。</p><div class="lab-grid" style="margin-top:26px"><section class="panel"><h3>创建一条研究假设</h3><div class="field"><label for="idea-title">想法标题</label><input id="idea-title" class="form-input" placeholder="例如：对扭转角空间采用周期约束的 FM 路径"></div><div class="field"><label for="idea-problem">1. 真实失败模式 / 科学问题</label><textarea id="idea-problem" class="form-textarea" placeholder="什么地方失败了？观察到什么现象？"></textarea></div><div class="field"><label for="idea-assumption">2. 现有方法依赖什么数学假设？</label><textarea id="idea-assumption" class="form-textarea" placeholder="写出状态空间、路径或 loss 的关键假设"></textarea></div><div class="field"><label for="idea-change">3. 想改变哪条数学机制？</label><textarea id="idea-change" class="form-textarea" placeholder="提出一个精确定义的改变，不只是换网络模块"></textarea></div><div class="field"><label for="idea-predict">4. 可以被推翻的预测是什么？</label><textarea id="idea-predict" class="form-textarea" placeholder="在什么设置下应该变好？什么情况可能反而变差？"></textarea></div><div class="field"><label for="idea-experiment">5. 成本最低的验证实验与指标</label><textarea id="idea-experiment" class="form-textarea" placeholder="2D toy、几何约束误差、NFE、分子有效率……"></textarea></div><div class="btnrow"><button class="btn" data-action="save-idea">${editingIdeaIndex===null?'保存研究假设':'更新研究假设'} ${icon('check')}</button><button class="btn outline" data-action="example-idea">填入示例</button>${editingIdeaIndex!==null?'<button class="btn outline" data-action="cancel-edit">取消编辑</button>':''}</div></section><aside><div class="panel soft"><div class="eyebrow">IDEA QUALITY CHECK</div><h3 style="margin-top:9px">一个想法值得进一步实验吗？</h3><div class="bulletline">改动对象可以清晰写成数学定义</div><div class="bulletline">与已有方法存在明确区别</div><div class="bulletline">至少提出一项可能否定它的结果</div><div class="bulletline">最小实验能区分竞争解释</div><div class="bulletline">明确现实任务上的风险与成本</div></div><div class="panel" style="margin-top:16px"><h3>保存的研究想法 <span class="badge">${state.ideas.length} 条</span></h3>${state.ideas.length?state.ideas.map((i,k)=>`<div class="idea-item"><h3>${esc(i.title)}</h3><div class="tiny muted">${esc(i.created)}</div><p>${esc(i.predict)}</p><div class="btnrow" style="margin-top:6px"><button class="link-button" data-action="edit-idea" data-i="${k}">编辑</button><button class="link-button" data-action="export-idea" data-i="${k}">导出 MD</button><button class="link-button" style="color:#bf6e6e" data-action="delete-idea" data-i="${k}">删除</button></div></div>`).join(''):'<div class="empty">还没有保存的研究假设</div>'}</div></aside></div>${foot()}`}
function resourceCard(r){return `<a class="resource" target="_blank" rel="noopener noreferrer" href="${esc(r.url)}"><div class="resource-icon">↗</div><div><small>${esc(r.week)}</small><strong>${esc(r.title)}</strong><p>${esc(r.note)}</p></div></a>`}
function resourcesPage(){const groups=[...new Set(REFERENCES.map(r=>r.group))];return `<div class="eyebrow">CURATED SOURCES / PRIMARY REFERENCES</div><h1>学习资料库</h1><p class="lead">优先课程原站、论文主页和官方代码，不靠泛泛的资源堆积。打开对应周的单元后，只针对卡住的概念查阅资料；主线是推导与实验，而非刷完所有链接。</p><div class="panel soft section"><h3>本地配套实验</h3><p>下载完整网站 ZIP 后，在 <code>labs/</code> 文件夹中可以找到 4 个 Python 练习：二维 Flow Matching、ODE 求解器误差、SO(3) 插值和 OT 配对。网页本身可以离线浏览，外部资料链接需要联网。</p></div>${groups.map(g=>`<section class="resource-group"><div class="section-heading"><h2>${esc(g)}</h2></div><div class="resources-grid">${REFERENCES.filter(r=>r.group===g).map(resourceCard).join('')}</div></section>`).join('')}${foot()}`}
function settingsPage(){return `<div class="eyebrow">SETTINGS / PRIVACY & BACKUP</div><h1>设置与备份</h1><p class="lead">此网站无需登录，也不会把你的学习笔记上传服务器。进度、推导和研究假设保存在当前浏览器的 localStorage 中；换设备或清理浏览器前请先导出。</p><section class="section" style="max-width:740px"><div class="panel"><h3>数据概况</h3><div class="stats" style="margin:8px 0 22px"><div class="stat"><div class="number">${doneCount()}</div><div class="label">已完成</div></div><div class="stat"><div class="number">${Object.values(state.notes).filter(Boolean).length}</div><div class="label">课程笔记</div></div><div class="stat"><div class="number">${state.ideas.length}</div><div class="label">研究假设</div></div></div><div class="btnrow"><button class="btn" data-action="export-backup">${icon('download')} 导出 JSON 备份</button><button class="btn outline" data-action="export-notes">导出全部笔记 MD</button><button class="btn outline" data-action="import-backup">导入旧备份</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><p class="tiny muted" style="margin-top:14px">导入会覆盖当前进度，请先做好备份。</p></div><div class="panel" style="margin-top:15px"><h3>显示设置</h3><label style="display:flex;gap:12px;align-items:center;font-size:12px"><input class="checkbox" type="checkbox" data-dark ${state.dark?'checked':''}> 使用深色模式</label></div><div class="panel" style="margin-top:15px"><h3>重置学习数据</h3><p>仅删除此网站存储的进度、笔记和研究假设；不会删除下载的文件。</p><button class="btn outline" style="color:#bb6262" data-action="reset">清空所有本地数据</button></div></section>${foot()}`}
function render(){document.body.classList.toggle('dark',!!state.dark);const [view,arg]=route(),root=document.querySelector('#page');const names={home:'学习总览',roadmap:'12 周路线',week:'周计划',lesson:'学习单元',concepts:'知识图谱',derivations:'推导工作台',derivation:'推导练习',visualizer:'交互直觉实验',lab:'研究实验室',resources:'资料库',settings:'设置与备份'};document.querySelector('#crumb').textContent=names[view]||'学习总览';const viewGroup=view==='week'||view==='lesson'?'roadmap':view==='derivation'?'derivations':view;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.go===viewGroup));document.querySelector('#side-completed').textContent=`${doneCount()} / ${LESSONS.length}`;document.querySelector('#side-meter').style.width=pct()+'%';document.querySelector('#theme-btn').innerHTML=icon(state.dark?'sun':'moon');root.innerHTML=({home,roadmap,concepts:conceptsPage,derivations:derivationsPage,visualizer:visualizerPage,lab:labPage,resources:resourcesPage,settings:settingsPage}[view]||(()=>view==='week'?weekPage(Number(arg)):view==='lesson'?lessonPage(arg):view==='derivation'?derivationPage(arg):home()))();document.title=(names[view]||'学习总览')+' · Math × Science'}
function download(filename,data,type='text/plain;charset=utf-8'){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function mdIdea(i){return `# ${i.title}\n\n创建日期：${i.created}\n\n## 1. 失败模式 / 科学问题\n${i.problem}\n\n## 2. 当前方法的数学假设\n${i.assumption}\n\n## 3. 拟修改的机制\n${i.change}\n\n## 4. 可证伪预测\n${i.predict}\n\n## 5. 最小实验与评价\n${i.experiment}\n`}
function handleAction(a,el){if(a==='save-idea'){const get=s=>document.querySelector('#idea-'+s)?.value.trim()||'';const idea={title:get('title'),problem:get('problem'),assumption:get('assumption'),change:get('change'),predict:get('predict'),experiment:get('experiment'),created:new Date().toLocaleDateString('zh-CN')};if(!idea.title||!idea.problem||!idea.predict){toast('请至少填写标题、科学问题和可证伪预测');return}if(editingIdeaIndex===null){state.ideas.unshift(idea)}else{idea.created=state.ideas[editingIdeaIndex].created;state.ideas[editingIdeaIndex]=idea;editingIdeaIndex=null}save();render();toast('研究假设已保存在本地')}else if(a==='edit-idea'){editingIdeaIndex=Number(el.dataset.i);const idea=state.ideas[editingIdeaIndex];for(const k of ['title','problem','assumption','change','predict','experiment'])document.querySelector('#idea-'+k).value=idea[k]||'';document.querySelector('#idea-title').scrollIntoView({behavior:'smooth',block:'center'});toast('已载入想法，修改后点击更新')}else if(a==='cancel-edit'){editingIdeaIndex=null;render()}else if(a==='example-idea'){const f={title:'扭转角上的周期性 Flow Matching',problem:'角度跨越 ±π 时，直接在实数轴做线性插值可能选取很长的路径。',assumption:'当前线性路径把角度当成 ℝ 上的普通坐标。',change:'将角度定义在 S¹ 上，利用 wrap(θ₁−θ₀) 定义局部最短插值；在切空间拟合速度。',predict:'跨周期边界的数据上降低路径长度和不合理中间状态；但在角度差接近 π 处可能出现分支歧义。',experiment:'两个峰分别位于 179° / −179° 的玩具数据；比较路径长度、边界处的连续性和采样误差。'};for(const [k,v] of Object.entries(f))document.querySelector('#idea-'+k).value=v;toast('已填入示例，请按你的项目修改')}else if(a==='delete-idea'){if(confirm('确定删除这条研究假设？')){state.ideas.splice(Number(el.dataset.i),1);save();render()}}else if(a==='export-idea'){const i=state.ideas[Number(el.dataset.i)];download('research-idea-'+(Number(el.dataset.i)+1)+'.md',mdIdea(i))}else if(a==='export-notes'){let md='# Math × Science · 全部学习笔记\n\n';for(const l of LESSONS){if(state.notes[l.id])md+=`## W${l.week} · ${l.name}\n\n${state.notes[l.id]}\n\n`}for(const d of DERIVATIONS){if(state.derivations[d.id])md+=`## 推导：${d.title}\n\n${state.derivations[d.id]}\n\n`}download('math4science-all-notes.md',md)}else if(a==='export-backup'){download('math4science-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json')}else if(a==='import-backup'){document.querySelector('#import-file').click()}else if(a==='reset'){if(confirm('确定清空所有本地进度、笔记和研究假设吗？此操作不能撤销。')){state=emptyState();save();render();toast('本地数据已清空')}}}
document.addEventListener('click',e=>{const goel=e.target.closest('[data-go]');if(goel){document.body.classList.remove('nav-open');go(goel.dataset.go);return}const scr=e.target.closest('[data-scroll]');if(scr){document.getElementById(scr.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}const vm=e.target.closest('[data-vis-mode]');if(vm){visMode=vm.dataset.visMode;render();return}const vp=e.target.closest('[data-vis-pair]');if(vp){visPair=vp.dataset.visPair;render();return}const f=e.target.closest('[data-filter]');if(f){conceptFilter=f.dataset.filter;render();return}const q=e.target.closest('[data-quiz]');if(q){state.quiz[q.dataset.quiz]=Number(q.dataset.option);save();render();document.getElementById('quiz')?.scrollIntoView({block:'center'});return}const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act);return}});
document.addEventListener('change',async e=>{if(e.target.dataset.complete){state.done[e.target.dataset.complete]=e.target.checked;save();render();toast(e.target.checked?'已标记完成 · 很好，继续保持推导训练':'已撤销完成状态')}else if(e.target.dataset.dark!==undefined){state.dark=e.target.checked;save();render()}else if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data.done!=='object'||typeof data.notes!=='object'||!Array.isArray(data.ideas))throw Error('格式不匹配');if(!confirm('导入将覆盖当前所有网站学习数据，确定继续？'))return;state={...emptyState(),...data};save();render();toast('备份导入成功')}catch{toast('导入失败：不是有效的网站备份 JSON')}}});
document.addEventListener('input',e=>{if(e.target.dataset.visTime!==undefined){visT=Number(e.target.value)/100;const o=visMode==='flow'?flowSvg():geoSvg();document.querySelector('.visual-stage').innerHTML=o.svg;document.querySelector('#vis-time-label').textContent=visT.toFixed(2);document.querySelector('#vis-metric-1').textContent=o.metric1;document.querySelector('#vis-metric-2').textContent=o.metric2;return}const n=e.target.dataset.note,d=e.target.dataset.derive;if(n){state.notes[n]=e.target.value;save()}if(d){state.derivations[d.id||d]=e.target.value;save()}});
document.querySelector('#theme-btn').addEventListener('click',()=>{state.dark=!state.dark;save();render()});document.querySelector('#menu-btn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));document.querySelector('#shade').addEventListener('click',()=>document.body.classList.remove('nav-open'));
const search=document.querySelector('#search'),results=document.querySelector('#search-results');search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();currentQuery=q;if(!q){results.classList.remove('open');results.innerHTML='';return}const matches=LESSONS.filter(l=>[l.name,l.weekLabel,l.intro,l.tags.join(' ')].join(' ').toLowerCase().includes(q)).slice(0,9);results.innerHTML=matches.length?matches.map(l=>`<button class="search-result" data-go="lesson/${l.id}"><strong>${esc(l.name)}</strong><small>W${l.week} · ${esc(l.weekLabel)}</small></button>`).join(''):'<div class="empty">没有匹配的知识单元</div>';results.classList.add('open')});search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';results.classList.remove('open')}else if(e.key==='Enter'){const first=results.querySelector('[data-go]');if(first)first.click()}});document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))results.classList.remove('open');if(e.target.closest('.search-result')){search.value='';results.classList.remove('open')}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();refreshLocalPdfManifest();
</script></body></html>
